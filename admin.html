<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الجداوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* تصميم لوحة التحكم - مستوحى من ألوان البانر */
        :root {
            --primary-orange: #ff8c00;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-light: #f4f4f4;
            --input-bg: #333;
            --border-color: #444;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            border: 2px solid var(--primary-orange);
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: var(--primary-orange); text-align: center; margin-top: 0; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }
        button {
            padding: 12px;
            background-color: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #e67e00; }
        .btn-danger { background-color: #e63946; }
        .btn-danger:hover { background-color: #c1121f; }
        .btn-save { background-color: #2a9d8f; font-size: 18px; width: 100%; margin-top: 20px;}
        .btn-save:hover { background-color: #21867a; }
        
        /* تنسيقات لوحة التحكم */
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; background: #444; padding: 10px; border-radius: 5px; cursor: pointer; text-align: center; font-weight: bold; }
        .tab-btn.active { background: var(--primary-orange); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .product-row {
            background: var(--input-bg);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .product-name { flex-grow: 1; font-size: 14px; }
        .product-row input { width: 100px; margin: 0; text-align: center; }

        .offer-card-admin, .category-card-admin {
            background: var(--input-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-right: 4px solid var(--primary-orange);
        }
        .offer-card-admin input, .category-card-admin input { margin-bottom: 8px; }
        
        .thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#444;cursor:pointer;flex:0 0 60px}
        .thumb.big{width:100%;height:auto;max-height:160px;flex:none}
        .product-row .nm{width:100%;margin:2px 0;text-align:right}
        .product-row .pr{width:90px;margin:2px 0}
        .mini{margin:0;padding:8px 12px;font-size:14px}
        #busy{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;z-index:9999}
        .hidden { display: none !important; }
        #loginScreen { max-width: 400px; }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div class="container" id="loginScreen">
        <h1>🔐 لوحة تحكم الجداوي</h1>
        <p style="text-align:center; font-size:14px; color:#aaa;">أدخل بيانات GitHub للدخول</p>
        
        <input type="text" id="githubUser" placeholder="اسم المستخدم (GitHub Username)">
        <input type="text" id="githubRepo" placeholder="اسم الريبو (Repository Name)">
        <input type="password" id="githubToken" placeholder="GitHub Token (Personal Access Token)">
        
        <button onclick="login()" style="width:100%;">دخول 🚀</button>
        <p id="loginError" style="color: #e63946; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- لوحة التحكم -->
    <div class="container hidden" id="dashboardScreen">
        <h1>⚙️ إدارة الموقع</h1>
        <button class="btn-danger" onclick="logout()" style="width: 100%; margin-bottom: 20px;">تسجيل خروج</button>

        <div class="tab-container">
            <div class="tab-btn active" onclick="openTab('productsTab')">المنتجات</div>
            <div class="tab-btn" onclick="openTab('offersTab')">العروض</div>
            <div class="tab-btn" onclick="openTab('categoriesTab')">الأقسام</div>
            <div class="tab-btn" onclick="openTab('featTab')">المميزة</div>
            <div class="tab-btn" onclick="openTab('bannerTab')">البانر</div>
        </div>

        <!-- تبويب المنتجات -->
        <div id="productsTab" class="tab-content active">
            <h3>المنتجات والصور</h3>
            <select id="categorySelect" onchange="loadProducts()">
                <option value="">-- اختر قسم --</option>
            </select>
            <div id="productsList" style="max-height: 400px; overflow-y: auto; padding-right: 5px;">
                <!-- المنتجات هتظهر هنا -->
            </div>
            <button onclick="addProduct()" style="width:100%">➕ إضافة منتج جديد</button>
        </div>

        <!-- تبويب العروض -->
        <div id="offersTab" class="tab-content">
            <h3>إدارة العروض والخصومات</h3>
            <div id="offersList">
                <!-- العروض هتظهر هنا -->
            </div>
            <button onclick="addOffer()" style="width:100%">➕ إضافة عرض جديد</button>
        </div>

        <!-- تبويب الأقسام -->
        <div id="categoriesTab" class="tab-content">
            <h3>صور الأقسام</h3>
            <div id="categoriesList">
                <!-- الأقسام هتظهر هنا -->
            </div>
        </div>

        <div id="featTab" class="tab-content"><h3>الصور المميزة (أسفل البانر)</h3><div id="featList"></div><button onclick="addFeat()" style="width:100%">➕ إضافة صورة مميزة</button></div>
        <!-- تبويب البانر -->
        <div id="bannerTab" class="tab-content">
            <h3>إعدادات البانر الرئيسي</h3>
            <div class="category-card-admin">
                <label>صورة البانر:</label><div id="bannerBox"></div>
            </div>
        </div>

        <button class="btn-save" onclick="saveToGithub()">💾 حفظ جميع التعديلات على GitHub</button>
    </div>

    <script>
let U='',R='',T='';
const D={products:{},offers:[],categories:{},banner:'',featured:[]},PREV={};
const DEF_FEAT=[{title:'برسيل جل 3 كجم',price:270,img:'https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?w=500&auto=format&fit=crop'},{title:'ديتول 950 مل',price:75,img:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500&auto=format&fit=crop'},{title:'شامبو صن سيلك',price:90,img:'https://images.unsplash.com/photo-1610555356070-d0efb6505f81?w=500&auto=format&fit=crop'}];
const $=id=>document.getElementById(id);
const api=p=>`https://api.github.com/repos/${U}/${R}/contents/${p}`;
const H=()=>({Authorization:`token ${T}`,'Content-Type':'application/json'});
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const src=p=>PREV[p]||p||'';
const busy=on=>$('busy').classList.toggle('hidden',!on);
async function getJson(p){const r=await fetch(api(p),{headers:H(),cache:'no-store'});if(!r.ok)return null;return JSON.parse(dec((await r.json()).content))}
async function put(p,b64,msg){let sha;const g=await fetch(api(p),{headers:H(),cache:'no-store'});if(g.ok)sha=(await g.json()).sha;
 const r=await fetch(api(p),{method:'PUT',headers:H(),body:JSON.stringify(Object.assign({message:msg,content:b64},sha?{sha}:{}))});
 if(!r.ok){let m=r.status;try{m=(await r.json()).message}catch(e){}throw new Error(m)}return r.json()}
async function login(){
 const u=$('githubUser').value.trim(),r=$('githubRepo').value.trim(),t=$('githubToken').value.trim();
 if(!u||!r||!t){$('loginError').innerText='الرجاء ملء جميع الخانات!';return}
 localStorage.setItem('gh_user',u);localStorage.setItem('gh_repo',r);localStorage.setItem('gh_token',t);
 U=u;R=r;T=t;
 if(await fetchData()){$('loginScreen').classList.add('hidden');$('dashboardScreen').classList.remove('hidden');renderUI()}
 else $('loginError').innerText='فشل الاتصال! تأكد من البيانات والتوكن.';
}
async function fetchData(){
 try{
  const p=await getJson('products.json');if(!p)throw new Error('products.json');D.products=p;
  const s=await getJson('site-data.json')||{};
  D.featured=(s.featured&&s.featured.length)?s.featured:DEF_FEAT.map(x=>Object.assign({},x));D.offers=s.offers||[];D.categories=s.categories||{};D.banner=s.banner||'assets/images/banner.jpg';
  return true;
 }catch(e){console.error(e);return false}
}
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=rej;im.src=URL.createObjectURL(f)})}
function up(kind,id,set){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;busy(1);
  try{const b=await shrink(f),path=`assets/uploads/${kind}-${id}-${Date.now().toString(36)}.jpg`;
   await put(path,b,'رفع صورة');PREV[path]='data:image/jpeg;base64,'+b;set(path);
   await saveAll(true);renderUI()}
  catch(e){alert('فشل رفع الصورة: '+e.message)}
  busy(0)};
 i.click();
}
const th=(p,fn,big)=>`<img class="thumb${big?' big':''}" src="${esc(src(p))}" alt="" onclick="${fn}">`;
function renderUI(){
 const sel=$('categorySelect'),cur=sel.value;
 sel.innerHTML='<option value="">-- اختر قسم --</option>'+Object.keys(D.products).map(k=>`<option value="${k}">${esc(D.products[k].title)}</option>`).join('');
 sel.value=cur;loadProducts();
 $('offersList').innerHTML=D.offers.map((o,i)=>`<div class="offer-card-admin">
  <div style="display:flex;gap:10px;align-items:center">${th(o.img,`upOffer(${i})`)}<div style="flex:1">
   <input type="text" value="${esc(o.title)}" placeholder="اسم العرض" onchange="D.offers[${i}].title=this.value">
   <input type="text" value="${esc(o.desc)}" placeholder="التفاصيل" onchange="D.offers[${i}].desc=this.value"></div></div>
  <div style="display:flex;gap:10px"><input type="number" value="${esc(o.price)}" placeholder="السعر الجديد" onchange="D.offers[${i}].price=Number(this.value)">
   <input type="number" value="${esc(o.oldPrice)}" placeholder="السعر القديم" onchange="D.offers[${i}].oldPrice=Number(this.value)"></div>
  <button class="btn-danger mini" onclick="delOffer(${i})">🗑 حذف العرض</button></div>`).join('');
 $('categoriesList').innerHTML=Object.keys(D.products).map(k=>`<div class="category-card-admin" style="display:flex;gap:12px;align-items:center">
  ${th(D.categories[k],`upCat('${k}')`)}<div><b>${esc(D.products[k].title)}</b><div style="font-size:12px;color:#aaa">اضغط الصورة لتغييرها</div></div></div>`).join('');
 $('featList').innerHTML=D.featured.map((f,i)=>`<div class="offer-card-admin"><div style="display:flex;gap:10px;align-items:center">${th(f.img,`upFeat(${i})`)}<div style="flex:1"><input type="text" value="${esc(f.title)}" placeholder="اسم المنتج" onchange="D.featured[${i}].title=this.value"><input type="number" value="${esc(f.price)}" placeholder="السعر" onchange="D.featured[${i}].price=Number(this.value)"></div></div><div style="display:flex;gap:8px"><button class="mini" onclick="moveFeat(${i},-1)">⬆</button><button class="mini" onclick="moveFeat(${i},1)">⬇</button><button class="btn-danger mini" onclick="delFeat(${i})">🗑 حذف</button></div></div>`).join('');
 $('bannerBox').innerHTML=th(D.banner,'upBanner()',true)+'<div style="font-size:12px;color:#aaa">اضغط الصورة لتغييرها</div>';
}
function openTab(id){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');event.target.classList.add('active')}
function loadProducts(){
 const c=$('categorySelect').value,l=$('productsList');l.innerHTML='';
 if(!c||!D.products[c])return;
 l.innerHTML=D.products[c].products.map((p,i)=>`<div class="product-row">${th(p.image,`upProd('${c}',${i})`)}
  <div style="flex:1;min-width:0"><input class="nm" type="text" value="${esc(p.name)}" onchange="D.products['${c}'].products[${i}].name=this.value">
  <input class="pr" type="number" value="${esc(p.price)}" placeholder="السعر" onchange="D.products['${c}'].products[${i}].price=Number(this.value)">
  <input class="pr" type="number" value="${esc(p.oldPrice||'')}" placeholder="قبل الخصم" onchange="setOld('${c}',${i},this.value)"></div>
  <button class="btn-danger mini" onclick="delProd('${c}',${i})">🗑</button></div>`).join('');
}
function addProduct(){const c=$('categorySelect').value;if(!c)return alert('اختر القسم الأول');
 let m=0;for(const k in D.products)D.products[k].products.forEach(p=>m=Math.max(m,p.code||0));
 D.products[c].products.unshift({code:m+1,name:'منتج جديد',price:0});loadProducts()}
function setOld(c,i,v){const p=D.products[c].products[i];const n=Number(v);if(n>0)p.oldPrice=n;else delete p.oldPrice}
function delProd(c,i){if(confirm('حذف المنتج؟')){D.products[c].products.splice(i,1);loadProducts()}}
function addOffer(){D.offers.push({title:'عرض جديد',desc:'',price:0,oldPrice:0,img:''});renderUI()}
function delOffer(i){if(confirm('حذف العرض؟')){D.offers.splice(i,1);renderUI()}}
function upProd(c,i){const p=D.products[c].products[i];up('p',p.code,x=>p.image=x)}
function upOffer(i){up('offer',i,x=>D.offers[i].img=x)}
function upCat(k){up('cat',k,x=>D.categories[k]=x)}
function addFeat(){D.featured.push({title:'منتج مميز',price:0,img:''});renderUI()}
function delFeat(i){if(confirm('حذف الصورة المميزة؟')){D.featured.splice(i,1);renderUI()}}
function moveFeat(i,d){const j=i+d;if(j<0||j>=D.featured.length)return;[D.featured[i],D.featured[j]]=[D.featured[j],D.featured[i]];renderUI()}
function upFeat(i){up('feat',i,x=>D.featured[i].img=x)}
function upBanner(){up('banner','main',x=>D.banner=x)}
async function saveAll(silent){
 busy(1);
 try{
  await put('products.json',enc(JSON.stringify(D.products,null,2)),'تحديث المنتجات');
  await put('site-data.json',enc(JSON.stringify({offers:D.offers,categories:D.categories,banner:D.banner,featured:D.featured},null,2)),'تحديث إعدادات الموقع');const chk=await getJson('site-data.json');if(!chk||chk.banner!==D.banner||(chk.featured||[]).length!==D.featured.length)throw new Error('الملف على GitHub لم يتحدث، حاول مرة أخرى');
  busy(0);if(!silent)alert('تم حفظ جميع التعديلات بنجاح ✅ (التغييرات تظهر على الموقع بعد دقيقة تقريباً)');
 }catch(e){busy(0);alert('فشل الحفظ: '+e.message)}
}
const saveToGithub=()=>saveAll(false);
function logout(){localStorage.removeItem('gh_token');location.reload()}
window.onload=async()=>{
 document.body.insertAdjacentHTML('beforeend','<div id="busy" class="hidden">⏳ جاري الحفظ...</div>');
 const u=localStorage.getItem('gh_user'),r=localStorage.getItem('gh_repo'),t=localStorage.getItem('gh_token');
 if(u&&r&&t){$('githubUser').value=u;$('githubRepo').value=r;$('githubToken').value=t;U=u;R=r;T=t;
  if(await fetchData()){$('loginScreen').classList.add('hidden');$('dashboardScreen').classList.remove('hidden');renderUI()}}
};
</script>
</body>
</html>
